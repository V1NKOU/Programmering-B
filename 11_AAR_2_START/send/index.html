<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Sender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js" integrity="sha512-3kmSDJDp+Sk6XIt2AAkhFUrdlBwtWf6eFuksz407qMKcV/d1xfvsF/o4glnPWX/P3/X4yQJ2EBHEBTaWoXGf1g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>

<body>
    <main>
        <div id="toast"></div>
        <div class="page show" id="page1">
            <h1 id="title">MQTT Drawing Pad</h1>
            <canvas id="draw-canvas" height="500px" width="500px" style="border: 4px solid black;"></canvas>
            <div id="settingsContainer">
                <div id="ballColors">
                    <h2>Colors</h2>
                    <div id="blackColor" class="colorOption selected" data-color="#000000"></div>
                    <div id="whiteColor" class="colorOption" data-color="#FFFFFF"></div>
                    <div id="redColor" class="colorOption" data-color="#c73d28"></div>
                    <div id="blueColor" class="colorOption" data-color="#2544db"></div>
                    <div id="greenColor" class="colorOption" data-color="#30b840"></div>
                </div>
                <div id="radiusScaleContainer">
                    <h2>Radius</h2>
                    <input type="range" min="1" max="40" value="10" name="" id="radiusScale" class="slider">
                </div>
            </div>
        </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
