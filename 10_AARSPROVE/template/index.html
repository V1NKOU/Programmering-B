<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Lexend:wght@100..900&family=Special+Elite&display=swap" rel="stylesheet">
    <title>Dihtektiv</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
    <script src="./firebase.js"></script>
    <link rel="icon" type="image/x-icon" href="./assets/glass.ico">
</head>

<body>
    <div id="timer">0 sek</div>

    <main>

        <!-- STARTSIDE -->
        <div class="page" id="start">
            <div class="overlay">
                <h1>Dihtektiv</h1>
                <p>Din eneste opgave er at finde morderen.<br>
                    Hvordan? Det er op til dig at finde ud af.</p>
                <button id="btn-start">Start spil</button>
                <div id="highscores">
                    <h2>High Scores</h2>
                    <ol id="score-list"></ol>
                </div>
            </div>
        </div>

        <!-- MISTÆNKTE -->
        <div class="page" id="main-room">
            <div id="main-room-hint" class="hint">Klik på en af de mistænkte eller gå til gerningsstedet.</div>

            <div class="suspect" id="suspect1">
                <img src="./assets/animations/suspect1idle/frame3.png" alt="Gilbert" id="room1suspect1img">
                <span class="suspect-options">
                    <button onclick="interrogate(1);" class="suspect-option greyStandardBox">Forhør</button>
                    <button onclick="confirmGuess(1);" class="suspect-option greyStandardBox">Anklag</button>
                </span>
            </div>
            <div class="suspect" id="suspect2">
                <img src="./assets/animations/suspect2idle/frame1.png" alt="Asta" id="room1suspect2img">
                <span class="suspect-options">
                    <button onclick="interrogate(2);" class="suspect-option greyStandardBox">Forhør</button>
                    <button onclick="confirmGuess(2);" class="suspect-option greyStandardBox">Anklag</button>
                </span>
            </div>
            <div class="suspect" id="suspect3">
                <img src="./assets/animations/suspect3idle/frame5.png" alt="Ludvig" id="room1suspect3img">
                <span class="suspect-options">
                    <button onclick="interrogate(3);" class="suspect-option greyStandardBox">Forhør</button>
                    <button onclick="confirmGuess(3);" class="suspect-option greyStandardBox">Anklag</button>
                </span>
            </div>
        </div>

        <!-- FORHØRINGSRUM -->
        <div class="page" id="interrogation-room">
            <button onclick="backBtn()" class="backBtn greyStandardBox" id="intBackBtn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/></svg></button>
            <span id="answer-container" class="hidden">
                <h2 id="answer-name"></h2>
                <p id="answer-text"></p>
            </span>
            <div id="interrogation-room-hint" class="hint">Stil den mistænkte spørgsmål. Genstande kan give flere muligheder.</div>
            <img src="./assets/animations/suspect1idle/frame3.png" alt="Gilbert" id="room2suspect1img" class="interrogant" style="display: none;">
            <img src="./assets/animations/suspect2idle/frame1.png" alt="Asta" id="room2suspect2img" class="interrogant" style="display: none;">
            <img src="./assets/animations/suspect3idle/frame5.png" alt="Ludvig" id="room2suspect3img" class="interrogant" style="display: none;">
            <img src="./assets/interrogation-room-table.png" alt="bord" id="interrogation-table">
            <span id="dialogOptContainer"></span>
        </div>

        <!-- SLUTSIDE -->
        <div class="page" id="end-screen">
            <div class="overlay">
                <h1 id="end-title"></h1>
                <p id="final-time"></p>
                <div id="save-score">
                    <input type="text" id="player-name" placeholder="Dit navn">
                    <button id="btn-save">Gem high score</button>
                </div>
                <button id="btn-restart">Spil igen</button>
            </div>
        </div>

    </main>
    <script src="./index.js"></script>
</body>

</html>
