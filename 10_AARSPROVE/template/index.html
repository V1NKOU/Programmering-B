<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Special+Elite&display=swap" rel="stylesheet">
    <title>Dihtektiv</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
    <script src="./firebase.js"></script>
</head>

<body>
    <div id="timer">0 sek</div>

    <main>

        <!-- STARTSIDE -->
        <div class="page" id="start" title="Start">
            <div class="overlay">
                <h1>Dihtektiv</h1>
                <p>Din eneste opgave er at finde morderen.<br>
                    Hvordan? Det er op til dig at finde ud af.</p>
                <button id="btn-start">Start spil</button>
                <div id="highscores">
                    <h2>High Scores</h2>
                    <ol id="score-list"></ol>
                </div>
            </div>
        </div>

        <!-- RUM 1: MISTÆNKTE -->
        <div class="page" id="main-room">
            <div id="main-room-hint" class="hint">Klik på en af de mistænkte eller gå til gerningsstedet.</div>

            <div class="suspect" id="suspect1">
                <img src="./assets/person1.png" alt="Mistænkt1" id="suspect1img">
                <span class="suspect-options"">
                    <a onclick="interrogate(1);" class="suspect-option">Forhør</a>
                    <a onclick="confirmGuess(1);" class="suspect-option">Anklag</a>
                </span>
            </div>
            <div class="suspect" id="suspect2">
                <img src="./assets/person2.png" alt="Mistænkt2" id="suspect2img">
                <span class="suspect-options">
                    <a onclick="interrogate(2);" class="suspect-option">Forhør</a>
                    <a onclick="confirmGuess(2);" class="suspect-option">Anklag</a>
                </span>
            </div>
            <div class="suspect" id="suspect3">
                <img src="./assets/person3.png" alt="Mistænkt3" id="suspect3img">
                <span class="suspect-options"">
                    <a onclick="interrogate(3);" class="suspect-option">Forhør</a>
                    <a onclick="confirmGuess(3);" class="suspect-option">Anklag</a>
                </span>
            </div>
        </div>

        <!-- RUM 2: FORHØRING -->
        <div class="page" id="interrogation-room" title="Forhøringsrum">

        </div>

        <!-- SLUTSIDE -->
        <div class="page" id="end-screen">
            <div class="overlay">
                <h1 id="end-title"></h1>
                <p id="final-time"></p>
                <div id="save-score">
                    <input type="text" id="player-name" placeholder="Dit navn">
                    <button id="btn-save">Gem high score</button>
                </div>
                <button id="btn-restart">Spil igen</button>
            </div>
        </div>

    </main>
    <script src="./index.js"></script>
</body>

</html>
